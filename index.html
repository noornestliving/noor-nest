<style> 
/* Base configuration layout rules to prevent screen breaks */ 
html, body { 
  margin: 0; 
  padding: 0; 
  width: 100%; 
  height: 100%; 
  background: #ffffff !important; 
  overflow-x: hidden; 
  display: block !important; 
  visibility: visible !important; 
  opacity: 1 !important; 
} 
* { 
  box-sizing: border-box; 
} 
img { 
  max-width: 100%; 
  height: auto; 
  display: block; 
} 
iframe { 
  border: none; 
  display: block !important; 
} 
/* ======================================================== 1. LAPTOP & DESKTOP STYLING (Default Screen Layout) ======================================================== */ 
.canva-responsive-wrapper { 
  position: relative; 
  width: 100%; 
  height: 0; 
  padding-top: 281.1127%; /* Your exact desktop aspect ratio parameter */ 
  padding-bottom: 0; 
  box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); 
  margin-top: 1.6em; 
  margin-bottom: 0.9em; 
  overflow: hidden; 
  border-radius: 8px; 
  will-change: transform; 
  display: block !important; 
  visibility: visible !important; 
} 
.canva-responsive-wrapper iframe { 
  position: absolute; 
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%; 
  display: block !important; 
  visibility: visible !important; 
} 
.brand-link { 
  display: block; 
  padding: 10px; 
  text-align: center; 
  text-decoration: none; 
  color: #000; 
  font-family: Arial, sans-serif; 
} 
/* ======================================================== 2. MOBILE DEVICE OVERRIDES (< 768px Screen Width) ======================================================== */ 
@media (max-width: 768px) { 
  html, body { 
    overflow: hidden !important; 
    height: 100dvh !important; 
    width: 100vw !important; 
    position: fixed; /* Prevents mobile browser gapping */ 
  } 
  /* Eliminates the desktop vertical padding compression block on cell phones */ 
  .canva-responsive-wrapper { 
    height: 100dvh !important; 
    width: 100vw !important; 
    max-width: 100vw !important; 
    padding-top: 0 !important; 
    margin: 0 !important; 
    border-radius: 0px !important; 
    box-shadow: none !important; 
  } 
  .canva-responsive-wrapper iframe { 
    height: 100% !important; 
    width: 100% !important; 
  } 
  /* Clean out extra desktop text spaces on phone display layers */ 
  .brand-link { 
    display: none !important; 
  } 
} 
</style> 
</head> 
<body> 
<!-- Target Canva Container with verified embed layout parameters --> 
<div class="canva-responsive-wrapper"> 
<iframe loading="lazy" src="https://canva.com" allowfullscreen="allowfullscreen" allow="fullscreen"> 
</iframe> 
</div> 
<a class="brand-link" href="https://canva.com" target="_blank" rel="noopener">Noor Nest Living</a> 

<!-- Youform Floating Assistant Launcher Widget Core Script Asset --> 
<script src="https://youform.com"></script> 

<!-- Animation Node Trigger Hook --> 
<script> 
document.addEventListener("DOMContentLoaded", () => { 
  const animated = document.querySelectorAll( '[data-aos],.animate,.animated' ); 
  animated.forEach((el) => { 
    el.style.opacity = "1"; 
    el.style.transform = "translateY(0)"; 
  }); 
}); 
</script> 
</body> 
</html>

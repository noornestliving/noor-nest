<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Mandatory tag to make mobile screens behave differently than desktop layouts -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noor Nest Living | Premium Home Organization Solutions</title>

    <style>
        /* Base page rules to kill horizontal side-scrolling or window gaps */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            overflow: hidden; /* Locks page scrollbars to the iframe container */
        }
        * {
            box-sizing: border-box;
        }

        /* ========================================================
           1. DESKTOP VIEW SETTINGS (Loads on computers)
           ======================================================== */
        .canva-wrapper {
            position: relative; 
            width: 100%; 
            height: 0; 
            padding-top: 281.1127%; /* Your exact desktop aspect ratio parameter */
            box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); 
            margin-top: 1.6em; 
            margin-bottom: 0.9em; 
            overflow: hidden; 
            border-radius: 8px; 
            will-change: transform;
        }

        .canva-wrapper iframe {
            position: absolute; 
            width: 100%; 
            height: 100%; 
            top: 0; 
            left: 0; 
            border: none; 
            padding: 0;
            margin: 0;
        }

        .brand-link {
            display: block;
            text-align: center;
            padding: 10px;
            text-decoration: none;
            color: #000;
        }

        /* ========================================================
           2. MOBILE VIEW SETTINGS (Loads ONLY on phone screens)
           ======================================================== */
        @media screen and (max-width: 768px) {
            html, body {
                height: 100dvh !important; /* Forces layout to fill dynamic mobile views */
                width: 100vw !important;
                position: fixed; /* Blocks background screen shifts */
            }

            /* Overwrites the fixed height block so it spreads fullscreen on phones */
            .canva-wrapper {
                height: 100dvh !important; 
                width: 100vw !important;
                padding-top: 0 !important; /* Destroys the desktop padding compression squeeze */
                margin: 0 !important;
                border-radius: 0px !important;
                box-shadow: none !important;
            }

            /* Configures the iframe to fill out the Vercel mobile viewport neatly */
            .canva-wrapper iframe {
                position: relative !important;
                height: 100% !important;
                width: 100% !important;
                object-fit: contain !important; /* Keeps your design crisp and centered on phones */
            }

            /* Hides the desktop link block on mobile screens */
            .brand-link {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Responsive Container Structure -->
    <div class="canva-wrapper"> 
        <iframe loading="lazy" src="https://canva.com" allowfullscreen="allowfullscreen" allow="fullscreen"> </iframe> 
    </div> 
    
    <a class="brand-link" href="https://canva.com" target="_blank" rel="noopener">NoorNestLiving</a>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 1. CRITICAL MOBILE METADATA: Forces mobile browsers to resize Canva components correctly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Website</title>

    <style>
        /* Reset margins and hidden boundaries to block desktop zooming overflow */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow-x: hidden; 
            background: #fff; 
        }
        
        * { 
            box-sizing: border-box; 
        }

        /* 2. OVERRIDE CANVA CONTAINER SIZES: Forces your Canva structure to match the layout width */
        div[style*="padding-top"], .canva-wrapper, [class*="canva"] {
            width: 100% !important;
            max-width: 100vw !important;
            margin-left: auto !important;
            margin-right: auto !important;
        }

        /* 3. RESIZE GRAPHICS AND CODES: Stops large desktop layout banners from expanding past your phone screen edge */
        iframe, img, svg, object {
            max-width: 100% !important;
            height: auto !important;
        }

        /* 4. HARD MOBILE SCREEN MEDIA OVERRIDES (< 768px) */
        @media screen and (max-width: 768px) {
            html, body {
                overflow-x: hidden !important;
            }
            
            /* Overwrites Canva's fixed structural height layouts on smaller mobile screens */
            div[style*="padding-top"] {
                padding-top: 130% !important; /* Dynamically balances standard Canva layouts to match long mobile viewports */
            }

            /* Scales global fonts down cleanly so desktop text sizes do not clip or break lines */
            body, p, span, h1, h2, h3 {
                word-wrap: break-word !important;
                overflow-wrap: break-word !important;
            }
        }
    </style>
</head>
<body>

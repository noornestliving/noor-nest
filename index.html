    <style>
        /* Base page rules to prevent horizontal layout breaks or window gaps */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #ffffff !important; 
            overflow-x: hidden;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        * { 
            box-sizing: border-box; 
        }
        img { 
            max-width: 100%; 
            height: auto; 
            display: block; 
        }
        iframe { 
            border: none; 
            display: block !important;
        }

        /* ========================================================
           1. LAPTOP & DESKTOP STYLING (Default Screen View)
           ======================================================== */
        .canva-smart-container { 
            position: relative;
            width: 100%;
            max-width: 1300px; /* Centers your content cleanly on widescreen monitors */
            height: 90vh; /* Premium desktop viewing frame height */
            margin: 25px auto;
            box-shadow: 0 4px 25px rgba(0,0,0,0.06);
            border-radius: 12px;
            overflow: hidden;
            display: block !important;
            visibility: visible !important;
        }
        .canva-smart-container iframe { 
            width: 100% !important;
            height: 100% !important;
            border: none !important;
        }
        .brand-link { 
            display: block; 
            padding: 10px; 
            text-align: center; 
            text-decoration: none; 
            color: #000; 
            font-family: Arial, sans-serif;
        }

        /* ========================================================
           2. MOBILE DEVICE OVERRIDES (< 768px Screen Width)
           ======================================================== */
        @media (max-width: 768px) { 
            html, body { 
                overflow: hidden !important; 
                height: 100dvh !important;
                width: 100vw !important;
                position: fixed; /* Locks background window jumps on mobile safari/chrome */
            } 
            
            /* Overrides layout sizes so the smart frame completely fills phone screens */
            .canva-smart-container {
                height: 100dvh !important;
                width: 100vw !important;
                max-width: 100vw !important;
                margin: 0 !important;
                border-radius: 0px !important;
                box-shadow: none !important;
            }
            .canva-smart-container iframe { 
                height: 100% !important;
                width: 100% !important;
            } 
            
            /* Removes extra footer spacing offsets on smaller phones */
            .brand-link {
                display: none !important;
            }
        }
    </style>
</head>

    <div class="canva-smart-container">

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const animated = document.querySelectorAll( '[data-aos],.animate,.animated' );

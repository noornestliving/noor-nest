<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noor Nest Living</title>

    <style>
        /* Essential structure rules to ensure the website is always visible */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #ffffff !important;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        
        * {
            box-sizing: border-box;
        }

        /* ========================================================
           UNIFIED RESPONSIVE WRAPPER (Works on Laptop & Phone)
           ======================================================== */
        .global-canva-wrapper {
            position: relative;
            width: 100%;
            max-width: 1200px; /* Nicely centers the page content on wide desktop screens */
            margin: 0 auto;
            /* Laptop aspect-ratio fallback sizing rule */
            height: auto;
            padding-top: 281.1127%; 
            overflow: hidden;
            display: block !important;
        }

        .global-canva-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            padding: 0;
            margin: 0;
            display: block !important;
        }

        /* ========================================================
           AUTOMATED PHONE SCALE RULES (< 768px screen width)
           ======================================================== */
        @media screen and (max-width: 768px) {
            html, body {
                overflow-x: hidden !important;
            }

            .global-canva-wrapper {
                /* Destroys the desktop ratio compression rule so it doesn't shrink into an icon */
                padding-top: 0 !important; 
                height: 100vh !important; /* Forces the box to take up the full phone screen height */
                width: 100vw !important;
            }

            .global-canva-wrapper iframe {
                position: relative !important;
                height: 100% !important;
                width: 100% !important;
                object-fit: contain !important; /* Aligns the presentation perfectly within the mobile display bounds */
            }
        }
    </style>
</head>
<body>

    <!-- Single, robust structure that loads on all devices without separate hide conditions -->
    <div class="global-canva-wrapper">
        <iframe loading="eager" src="https://canva.com" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
    </div>

</body>
</html>

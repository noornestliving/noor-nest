<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NoorNestLiving</title>

    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow-x: hidden; 
            background: #fff; 
        }
        
        * { 
            box-sizing: border-box; 
        }

        /* Default configuration rule for standard desktop displays */
        .canva-outer-wrapper {
            width: 100%;
            overflow: hidden;
        }

        .canva-container {
            position: relative; 
            width: 100%; 
            height: 0; 
            padding-top: 281.1127%; 
            box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); 
            margin-top: 1.6em; 
            margin-bottom: 0.9em; 
            border-radius: 8px; 
            will-change: transform;
        }

        .canva-container iframe {
            position: absolute; 
            width: 100%; 
            height: 100%; 
            top: 0; 
            left: 0; 
            border: none; 
            padding: 0;
            margin: 0;
        }

        .brand-link {
            display: block;
            text-align: center;
            padding: 10px;
            text-decoration: none;
            color: #000;
            font-family: Arial, sans-serif;
        }

        /* =======================================================
           ADVANCED TARGET FORCE-SCALE OVERRIDE FOR MOBILE PHONES
           ======================================================= */
        @media screen and (max-width: 480px) {
            .canva-outer-wrapper {
                width: 100vw;
                height: 90vh;
                position: relative;
                overflow: hidden;
            }

            /* Zoom scale to expand the shrinking Canva embed framework */
            .canva-container {
                width: 210% !important; 
                height: 210% !important; 
                padding-top: 0 !important;
                position: absolute;
                top: -5%;
                left: -55%; 
                transform: scale(0.48); 
                transform-origin: top center;
            }
            
            .canva-container iframe {
                width: 100% !important;
                height: 100% !important;
            }
        }
    </style>
</head>
<body>

    <!-- Wrapped outer shell handles scaling calculation boundaries -->
    <div class="canva-outer-wrapper">
        <div class="canva-container"> 
            <iframe loading="lazy" src="https://canva.com" allowfullscreen="allowfullscreen" allow="fullscreen"> </iframe> 
        </div> 
    </div>
    
    <a class="brand-link" href="https://canva.com" target="_blank" rel="noopener">NoorNestLiving</a>

</body>
</html>

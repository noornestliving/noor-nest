<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Mandatory tag to make mobile screens behave differently than desktop layouts -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noor Nest Living</title>

    <style>
        /* Base page rules to kill horizontal side-scrolling or window gaps */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff !important;
            overflow-x: hidden;
        }
        * {
            box-sizing: border-box;
        }

        /* ========================================================
           1. LAPTOP & DESKTOP STYLING (Default Screen Sizing)
           ======================================================== */
        .canva-iframe-container {
            position: relative;
            width: 100%;
            max-width: 1200px; /* Nicely centers the page content on wide desktop screens */
            margin: 20px auto;
            height: 85vh; /* Standard viewport display box size for laptops */
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border-radius: 12px;
            overflow: hidden;
            display: block !important;
        }

        .canva-iframe-container iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            padding: 0;
            margin: 0;
            display: block !important;
        }

        /* ========================================================
           2. MOBILE DEVICE OVERRIDES (< 768px Screen Width)
           ======================================================== */
        @media screen and (max-width: 768px) {
            html, body {
                height: 100dvh !important; /* Forces layout to fill dynamic mobile views */
                width: 100vw !important;
                overflow: hidden !important; 
                position: fixed; /* Blocks background screen shifts */
            }

            /* Overwrites the fixed height block so it spreads fullscreen on phones */
            .canva-iframe-container {
                height: 100dvh !important; 
                width: 100vw !important;
                max-width: 100vw !important;
                margin: 0 !important;
                border-radius: 0px !important;
                box-shadow: none !important;
            }

            /* Configures the iframe to fill out the Vercel mobile viewport neatly */
            .canva-iframe-container iframe {
                height: 100% !important;
                width: 100% !important;
            }
        }
    </style>
</head>
<body>

    <!-- Pure, scriptless container structure that avoids server security blockages -->
    <div class="canva-iframe-container">
        <iframe src="https://canva.com" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
    </div>

</body>
</html>

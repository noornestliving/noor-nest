<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Critical for mobile viewport scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noor Nest Living | Premium Home Organization Solutions</title>

    <style>
        /* Base configuration resets */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            overflow-x: hidden;
        }
        * {
            box-sizing: border-box;
        }

        /* ========================================================
           1. DEFAULT LAPTOP & DESKTOP STYLING 
           ======================================================== */
        .canva-wrapper {
            position: relative; 
            width: 100%; 
            height: 0; 
            padding-top: 281.1127%; /* Your exact desktop aspect ratio */
            box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); 
            margin: 1.6em auto 0.9em auto; 
            max-width: 1200px; /* Centers the content nicely on large laptop screens */
            overflow: hidden; 
            border-radius: 8px; 
            will-change: transform;
            display: block !important; /* Fixes laptop visibility block */
        }

        .canva-wrapper iframe {
            position: absolute; 
            width: 100%; 
            height: 100%; 
            top: 0; 
            left: 0; 
            border: none; 
            padding: 0;
            margin: 0;
            display: block !important;
        }

        .brand-link {
            display: block;
            text-align: center;
            padding: 10px;
            text-decoration: none;
            color: #000;
        }

        /* ========================================================
           2. MOBILE DEVICE OVERRIDES (< 768px Width)
           ======================================================== */
        @media screen and (max-width: 768px) {
            html, body {
                height: 100dvh !important; /* Locks screen limits safely on phones */
                width: 100vw !important;
                overflow: hidden !important; 
                position: fixed; 
            }

            /* Strips out aspect ratio padding so the page fills up mobile screens inside Vercel */
            .canva-wrapper {
                height: 100dvh !important; 
                width: 100vw !important;
                max-width: 100vw !important;
                padding-top: 0 !important; 
                margin: 0 !important;
                border-radius: 0px !important;
                box-shadow: none !important;
            }

            .canva-wrapper iframe {
                height: 100% !important;
                width: 100% !important;
                object-fit: contain !important;
            }

            /* Clear out extra text link footers on mobile screens */
            .brand-link {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Container scales globally on Vercel without page redirects -->
    <div class="canva-wrapper"> 
        <iframe loading="lazy" src="https://canva.com" allowfullscreen="allowfullscreen" allow="fullscreen"> </iframe> 
    </div> 
    
    <a class="brand-link" href="https://canva.com" target="_blank" rel="noopener">NoorNestLiving</a>

</body>
</html>

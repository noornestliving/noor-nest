<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- CRITICAL: This tag forces mobile browsers to scale your Canva embed instead of zooming out -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NoorNestLiving</title>

    <style>
        /* Base styles to prevent horizontal layout breakages */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow-x: hidden; 
            background: #fff; 
        }
        
        * { 
            box-sizing: border-box; 
        }

        /* Target your specific Canva embed container structure */
        .canva-container {
            position: relative; 
            width: 100%; 
            height: 0; 
            padding-top: 281.1127%; /* Default desktop height proportions */
            padding-bottom: 0; 
            box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); 
            margin-top: 1.6em; 
            margin-bottom: 0.9em; 
            overflow: hidden; 
            border-radius: 8px; 
            will-change: transform;
        }

        .canva-container iframe {
            position: absolute; 
            width: 100%; 
            height: 100%; 
            top: 0; 
            left: 0; 
            border: none; 
            padding: 0;
            margin: 0;
        }

        .brand-link {
            display: block;
            text-align: center;
            padding: 10px;
            text-decoration: none;
            color: #000;
            font-family: Arial, sans-serif;
        }

        /* =======================================================
           MOBILE MOBILE SCREEN CONFIGURATION (< 768px width)
           ======================================================= */
        @media screen and (max-width: 768px) {
            html, body {
                height: 100dvh;
                width: 100vw;
            }

            /* Breaks the locked desktop height ratio and adapts layout dynamically */
            .canva-container {
                height: 90dvh !important; /* Spans almost the full mobile display height */
                padding-top: 0 !important; /* Completely neutralizes the desktop padding block */
                margin-top: 0.5em;
                margin-bottom: 0.5em;
                border-radius: 0px; /* Removes border roundings to blend cleanly into the screen edge */
            }

            .canva-container iframe {
                height: 100% !important;
                width: 100% !important;
                object-fit: contain; /* Keeps Canva layouts crisp and beautifully aligned on screens */
            }
        }
    </style>
</head>
<body>

    <!-- Modified Canva Embed Container with Class Assignment -->
    <div class="canva-container"> 
        <iframe loading="lazy" src="https://www.canva.com/design/DAHMq9B5miU/izr-0v8MBb_mSiWT741X3Q/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"> </iframe> 
    </div> 
    
    <a class="brand-link" href="https://canva.com" target="_blank" rel="noopener">NoorNestLiving</a>

</body>
</html>
